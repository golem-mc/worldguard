name: Release

# release-please keeps a release pull request open that bumps the version and
# updates CHANGELOG.md from the conventional commits on main. Merging it tags
# the release (vX.Y.Z) and creates it on GitHub. golem-launcher builds plugins
# from source, so the tag is all a server needs.
on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    name: Release PR
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v5
        with:
          # A pull request opened with the default token starts no workflows,
          # so CI would not run on the release PR; a token of a GitHub App or
          # a user with access to the repository avoids that.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
